name = "web"
main = "index.js"
compatibility_date = "2024-09-23"

# Phân phối trực tiếp toàn bộ giao diện tĩnh từ thư mục dist/ tại Cloudflare Edge CDN
[assets]
directory = "./dist"

# Biến môi trường kết nối Backend Render và TiDB Cloud Serverless HTTPS API
