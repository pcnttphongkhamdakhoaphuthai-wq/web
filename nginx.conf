# ==============================================================================
# CẤU HÌNH NGINX MẪU CHO CLOUD VPS (NGINX + PHP-FPM 8.2)
# Đặt cấu hình này vào /etc/nginx/sites-available/web_phongkham và symlink sang sites-enabled
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    root /var/www/html/web;
    index index.php index.html;

    # Kích thước tải lên tối đa (phục vụ upload kết quả khám bệnh PDF)
    client_max_body_size 64M;

    # Tắt hiển thị danh sách thư mục
    autoindex off;

    # 1. Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 2. Chặn tuyệt đối các file nhạy cảm và file cấu hình
    location ~* \.(sql|secrets\.php|env|log|zip|rar|7z|md|ps1|sh|yaml|yml)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # 3. Chặn các thư mục nội bộ và storage/uploads không cho duyệt file trực tiếp
    location ^~ /admin_accounts_tabs/ { deny all; return 403; }
    location ^~ /dashboard_tabs/ { deny all; return 403; }
    location ^~ /tools/ { deny all; return 403; }
    location ^~ /logs/ { deny all; return 403; }
    location ^~ /storage/ { deny all; return 403; }

    # 4. Cấu hình Pretty URLs: tự động ánh xạ URL không đuôi sang file .php
    location / {
        try_files $uri $uri/ @extensionless-php;
    }

    location @extensionless-php {
        rewrite ^(.*)$ $1.php last;
    }

    # 5. Xử lý PHP thông qua PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # 6. Tối ưu nén Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # 7. Caching tài nguyên tĩnh
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
